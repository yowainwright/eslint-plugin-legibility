name: update deps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
      - run: nub install --frozen-lockfile
      - name: Update dependencies
        run: nub run codependence:update
      - name: Install updated dependencies
        run: nub install --no-frozen-lockfile
      - name: Apply CVE overrides and update metadata
        run: nub run pastoralist
      - name: Apply override updates
        run: nub install --no-frozen-lockfile
      - name: Verify dependency policy
        run: nub run codependence
      - name: Verify override metadata
        run: nub run pastoralist --dry-run --strict
      - run: nub run validate
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "[Codependence] update dependencies"
          body: |
            ## Dependency updates

            Auto-generated by [Codependence][1] and audited by [Pastoralist][2].

            [1]: https://github.com/yowainwright/codependence
            [2]: https://github.com/yowainwright/pastoralist
          branch: update-dependencies
          labels: codependencies
